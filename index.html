<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engr.Isabelle</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="hero" aria-label="Banner inicial">
      <div class="hero-overlay">
        <div class="hero-content">
          <p class="eyebrow"></p>
          <h1>Hi, I'm Isabelle</h1>
          <p class="role">Backend Developer &amp; Tech Creator</p>
          <p class="description">
            Backend Developer &amp; Tech Content Creator. Building modern web
            experiences and sharing my journey with the dev community.
          </p>
        </div>
      </div>
    </section>

    <script>
      const root = document.body;

      window.addEventListener('pointermove', (event) => {
        root.style.setProperty('--cursor-x', `${event.clientX}px`);
        root.style.setProperty('--cursor-y', `${event.clientY}px`);
      });
    </script>
  </body>
</html>
